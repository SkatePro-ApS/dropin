[package]
name = "dropin-app"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
description = "Drop In: a push dialog that shows what a push sends before it goes"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dropin-git = { path = "../git" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync"] }
tauri-plugin-dialog = "2"
# native-tls: Windows' own certificate store, so the update check also works behind a TLS-inspecting proxy.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
