[package]
name = "dropin-git"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2021"
description = "Drop In's git work: outgoing commits, reviewed push, rebase in a worktree, adopt"

# No Tauri here, so the tests build in seconds.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"
